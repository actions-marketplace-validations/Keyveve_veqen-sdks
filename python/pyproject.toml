[project]
name = "veqen"
version = "1.4.0"
description = "What every AI request costs, by customer, feature or project, with the key hint that lets Veqen catch stolen keys."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
dependencies = []
keywords = ["llm cost", "token cost", "openai pricing", "anthropic pricing", "ai cost tracking", "llm budget", "finops", "cogs"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Office/Business :: Financial :: Accounting",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
litellm = ["litellm>=1.106.2"]
haystack = ["haystack-ai>=3.4,<4"]
llamaindex = ["llama-index-core>=0.12"]
test = ["pytest>=8", "langchain-core>=0.3", "litellm>=1.106.2", "llama-index-core>=0.12"]

[project.urls]
Homepage = "https://veqen-app.com"
Documentation = "https://veqen-app.com/docs"
Source = "https://github.com/Keyveve/veqen-sdks/tree/main/python"
Issues = "https://github.com/Keyveve/veqen-sdks/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["veqen*"]

[tool.setuptools.package-data]
veqen = ["data/*.json"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["veqen", "conftest"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
